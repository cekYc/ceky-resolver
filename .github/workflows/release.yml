name: Release

# "v5.0.0" gibi bir etiket gönderildiğinde tüm platformlar için derleyip
# GitHub Releases sayfasına indirilebilir paketler olarak yükler.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Testler
        run: go test ./...

      - name: Paketleri derle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="$(git rev-parse --short HEAD)"
          scripts/build-release.sh "$VERSION"

      - name: Yapıtları sakla
        uses: actions/upload-artifact@v4
        with:
          name: ceky-resolver-dist
          path: dist/*

      - name: GitHub sürümü oluştur
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
